name: Docker build image and push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
  
  docker:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: {{ secrets.DOCKERHUB_USERNAME }}
          password: {{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Image build
        run: |
          docker build \
          -t {{ secrets.DOCKER_USERNAME }}/simple-node-app:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/simple-node-app:${{ github.sha }}
          .
      
      - name: Push latest image
        run: docker push {{ secrets.DOCKER_USERNAME }}/simple-node-app:latest
      
      - name: Push github sha image
        run: docker push {{ secrets.DOCKER_USERNAME }}/simple-node-app:${{ github.sha }}